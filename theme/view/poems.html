<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{$title} - Think Store Example</title>
<meta name="description" content="{$description}">
<link rel="stylesheet" href="{$assets}/layui/css/layui.css">
<link rel="stylesheet" href="{$assets}/css/index.css">
</head>
<body class="store-page">
<header class="store-header">
    <div class="layui-container store-header__inner">
        <a class="store-brand" href="{$home}">Think Store Example</a>
        <ul class="layui-nav store-nav" lay-filter="store-nav">
            <li class="layui-nav-item"><a href="{$home}">首页</a></li>
            <li class="layui-nav-item"><a href="{$base}/intro">项目介绍</a></li>
            <li class="layui-nav-item layui-this"><a href="{$base}/poems">唐诗示例</a></li>
            <li class="layui-nav-item"><a href="{$base}/detail">示例详情</a></li>
        </ul>
        <span class="store-version">{$version}</span>
    </div>
</header>
<main class="store-main" data-base="{$base}" data-api="{$api}" data-assets="{$assets}">
    <div class="layui-container">
        <section class="store-hero">
            <p class="store-eyebrow">laytpl · GET {$api}</p>
            <h1 class="store-title">随机唐诗示例</h1>
            <p class="store-subtitle">页面使用 layui 的 laytpl 模板引擎渲染接口返回的 JSON，每次点击都会重新抽取一首。诗库共 {$poemCount} 首。</p>
            <p class="store-actions">
                <button class="layui-btn layui-btn-normal" id="poem-refresh" type="button">换一首</button>
                <a class="layui-btn layui-btn-primary" href="{$base}/intro">查看接口说明</a>
            </p>
        </section>

        <div class="poem-panel" id="poem-result">
            <div class="poem-loading">正在加载唐诗...</div>
        </div>

        <p class="store-note">接口地址由页面 <code>data-api</code> 提供：<code>{$api}</code>。</p>
    </div>
</main>
<footer class="store-footer">
    <div class="layui-container store-footer__inner">
        <span>youvision/think-store-example · {$version}</span>
        <span>MIT License · ThinkPHP 8</span>
    </div>
</footer>
<script src="{$assets}/layui/layui.js"></script>
<script src="{$assets}/js/common.js"></script>
<script src="{$assets}/js/poems.js"></script>
</body>
</html>
