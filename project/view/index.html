<div class="layui-col-md6 layui-col-lg3 store-card-col" data-app="{{ package_name }} {{ keywords }}">
    <div class="layui-card store-card">
        <div class="layui-card-header">
            <span class="layui-badge layui-bg-green">{{ type }}</span>
            <span class="store-card__title">{{ title }}</span>
        </div>
        <div class="layui-card-body">
            <p class="store-card__desc">{{ description }}</p>
            <p class="store-card__meta">PHP {{ php }} · ThinkPHP {{ thinkphp }}</p>
        </div>
    </div>
</div>
